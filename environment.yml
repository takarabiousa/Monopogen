name: monopogen
channels:
  - conda-forge
  - bioconda
dependencies:
  # Matches CogentAP's already-validated pins for this codebase
  # (config/env/monopogen.yaml) rather than latest bioconda releases.
  - python=3.9
  - samtools=1.11
  - bcftools=1.15.1
  - tabix=1.11
  - pysam=0.20.0
  - numpy=1.19.5
  - pandas=1.1.5
  - scipy=1.6.3
  # picard=3.0.0's only bioconda build still resolvable here requires
  # openjdk>=17 (confirmed directly: pinning openjdk=11.0.9.1 got a picard
  # build compiled for Java 17 class files anyway, and picard crashed with
  # UnsupportedClassVersionError -- conda did not pick a compatible build
  # automatically, despite an older openjdk>=8 build existing on paper).
  # Old bytecode runs fine on a newer JVM, so Beagle 4.1 (2017-era) is
  # unaffected by using 17 instead of 11 here.
  - openjdk=17.0.9
  # Beagle 4.1: the code hardcodes beagle.27Jul16.86a.jar and passes
  # modelscale=/niterations=/impute=/gprobs= -- Beagle 4.x-only parameters
  # that Beagle 5.x's rewritten phasing algorithm no longer accepts.
  # 4.1_21Jan17.6cc.jar is the closest 4.1 build bioconda still hosts.
  - beagle=4.1_21Jan17.6cc.jar
  # Only needed for the optional GRCh38->GRCh37 liftover step documented in
  # README's "ancestry identification" section, not the core preProcess/
  # germline/somatic pipeline.
  - picard=3.0.0
  # Required by src/LDrefinement.R (somatic --step LDrefinement), invoked
  # via Rscript. r-base itself isn't pinned explicitly; conda resolves a
  # compatible one as a transitive dependency of these, matching
  # CogentAP's own already-validated approach.
  - r-data.table=1.14.0
  - r-e1071=1.7_7
  - r-ggplot2=3.3.3
  # data.table::fread() needs R.utils at runtime to read gzipped files
  # directly (LDrefinement.R calls fread() on a .gz path) -- not caught by
  # grepping LDrefinement.R's own library() calls, since fread() loads it
  # internally rather than the script requesting it directly.
  - r-r.utils=2.10.1
